<title>Stüdyo Panosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Düzen: üstte canlı ofis (2D: 6 departman odası, dinlenme salonu, eş odası), altında canlı akış, projeler ve iş tahtası. */
:root {
  --bg: #efebe4; --panel: #f8f6f1; --ink: #23211f; --muted: #6d6760; --line: #d9d2c7;
  --accent: #b23a2b; --copper: #a8642f;
  --floor: #e8dcc8; --plank: #dccdb4; --wall: #3b3733; --wall-in: #5a534c; --hall: #cfc6b6; --hall-tile: #c4baa8;
  --desk: #8a6a4a; --desk-top: #a7825d; --screen: #22303d; --glow: #8fd3ff;
  --sofa: #b85c3e; --sofa-dark: #8f452d; --rug: #c9a24a; --rug2: #9b3d2e; --plant: #3f7d4f; --pot: #a8642f;
  --claude: #d97757; --claude-dark: #b85c3e; --cheek: #f2a48a; --bubble: #ffffff; --bubble-ink: #23211f;
  --spouse-a: #8e7cc3; --spouse-b: #4fa3a5; --heart: #d6455d; --paper: #f4efe2; --paper-ink: #3b3733;
  --me: #d9a520; --me-dark: #a87c10; --crown: #f2c94c;
  --d-yapim: #b23a2b; --d-seviye: #2f7d55; --d-sanat: #8a4fa3; --d-unity: #3a6ea5; --d-qa: #b7791f; --d-yayin: #4b5563;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a19; --panel: #252321; --ink: #ece7df; --muted: #a39b91; --line: #3a3633; --accent: #e0604d; --copper: #d08a50;
  --floor: #3a332b; --plank: #342e27; --wall: #0f0e0d; --wall-in: #2a2622; --hall: #24211e; --hall-tile: #2b2824;
  --desk: #6b5038; --desk-top: #7d5f43; --screen: #101820; --glow: #6fc3ff;
  --sofa: #a8543a; --sofa-dark: #7a3c28; --rug: #8d7134; --rug2: #6e2c21; --plant: #4f9a62; --pot: #b9773f;
  --claude: #e08463; --claude-dark: #b8603f; --cheek: #f0a08a; --bubble: #f3efe8; --bubble-ink: #1b1a19;
  --spouse-a: #a395d6; --spouse-b: #62b8ba; --heart: #ee6077; --paper: #e8e1d2; --paper-ink: #2a2622;
  --me: #e6b43a; --me-dark: #b8892a; --crown: #f6d76b;
  --d-yapim: #e0604d; --d-seviye: #5bb487; --d-sanat: #b585cc; --d-unity: #6b9ed6; --d-qa: #e0a84a; --d-yayin: #9aa3af;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1a19; --panel: #252321; --ink: #ece7df; --muted: #a39b91; --line: #3a3633; --accent: #e0604d; --copper: #d08a50;
  --floor: #3a332b; --plank: #342e27; --wall: #0f0e0d; --wall-in: #2a2622; --hall: #24211e; --hall-tile: #2b2824;
  --desk: #6b5038; --desk-top: #7d5f43; --screen: #101820; --glow: #6fc3ff;
  --sofa: #a8543a; --sofa-dark: #7a3c28; --rug: #8d7134; --rug2: #6e2c21; --plant: #4f9a62; --pot: #b9773f;
  --claude: #e08463; --claude-dark: #b8603f; --cheek: #f0a08a; --bubble: #f3efe8; --bubble-ink: #1b1a19;
  --spouse-a: #a395d6; --spouse-b: #62b8ba; --heart: #ee6077; --paper: #e8e1d2; --paper-ink: #2a2622;
  --me: #e6b43a; --me-dark: #b8892a; --crown: #f6d76b;
  --d-yapim: #e0604d; --d-seviye: #5bb487; --d-sanat: #b585cc; --d-unity: #6b9ed6; --d-qa: #e0a84a; --d-yayin: #9aa3af;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 50px); line-height: .95; margin: 4px 0 0; text-wrap: balance; }
.counts { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.count b { display: block; font-family: var(--f-display); font-size: 28px; line-height: 1; }
.count span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
h2 { font-family: var(--f-display); font-size: 21px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 10px; }
.office { position: relative; border: 3px solid var(--wall); background: var(--hall); border-radius: 6px; overflow: hidden; }
.office canvas { display: block; width: 100%; height: auto; cursor: pointer; }
.live { display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); padding: 8px 12px; font-family: var(--f-mono); font-size: 12.5px; min-width: 0; border-radius: 6px; }
.live .dot { width: 9px; height: 9px; border-radius: 50%; background: #3fd17a; flex: none; }
.live .dot.off { background: var(--muted); }
.live span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.feed { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-height: 20px; }
.feed span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.inspect { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); padding: 10px 12px; font-size: 14px; min-height: 44px; }
.inspect b { font-family: var(--f-display); font-size: 18px; }
.mebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
.mebar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.mebar input, .talk input { font: 14px var(--f-body); padding: 6px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; width: 9.5em; }
.talk { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--me)); padding: 10px 12px; display: grid; gap: 8px; }
.talk b { font-family: var(--f-display); font-size: 19px; }
.talk .answer { font-size: 15px; margin: 0; min-height: 1.4em; }
.talk form { display: flex; gap: 8px; flex-wrap: wrap; }
.talk form input { flex: 1; min-width: 10em; width: auto; }
.chip:disabled { opacity: .5; cursor: default; }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: none; gap: 6px; }
.tab { flex: 1; font: 600 13px var(--f-body); padding: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { display: grid; gap: 10px; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.col-h h3 { margin: 0; font-family: var(--f-display); font-size: 18px; text-transform: uppercase; letter-spacing: .05em; }
.col-h span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.card h4 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.meta .d { color: var(--c); font-weight: 500; }
.card p { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 2px 7px; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.proj { background: var(--panel); border: 1px solid var(--line); padding: 12px; display: grid; gap: 4px; min-width: 0; }
.proj .n { font-family: var(--f-display); font-size: 21px; font-weight: 700; }
.note { font-size: 13px; color: var(--muted); }
.pill { justify-self: start; font-family: var(--f-mono); font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.s-aktif { color: var(--d-seviye); } .s-bekliyor { color: var(--d-qa); } .s-arsiv { color: var(--muted); }
@media (max-width: 760px) {
  .tabs { display: flex; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .col[data-hide="1"] { display: none; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Claude ajan stüdyosu · canlı ofis</div>
      <h1 id="studioName">Oyun Stüdyosu</h1>
    </div>
    <div class="counts">
      <div class="count"><b id="cDoing">0</b><span>Sürüyor</span></div>
      <div class="count"><b id="cTodo">0</b><span>Yapılacak</span></div>
      <div class="count"><b id="cDone">0</b><span>Bitti</span></div>
    </div>
  </header>

  <section style="display:grid;gap:8px">
    <div class="live"><span class="dot off" id="liveDot"></span><span id="liveText">Ofis açılıyor…</span></div>
    <div class="office"><canvas id="office" width="960" height="640" aria-label="Ajanların çalıştığı ofis"></canvas></div>
    <div class="mebar">
      <label for="meName">Adın <input id="meName" maxlength="16" placeholder="Patron"></label>
      <label for="spName">Eşinin adı <input id="spName" maxlength="16" placeholder="Eşim"></label>
      <button class="chip" type="button" id="callSpouse">Eşimi çağır</button>
      <span class="note">Ofiste bir yere dokun: oraya yürürsün. Bir ajana dokun: yanına gidip konuşursun.</span>
    </div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="talk" id="talk" hidden>
      <div><b id="talkWho"></b> <span class="note" id="talkRole"></span></div>
      <p class="answer" id="talkAnswer" aria-live="polite"></p>
      <div class="filters" id="talkOpts"></div>
      <form id="askForm" hidden><input id="askInput" maxlength="200" placeholder="Kendi sorunu yaz…" aria-label="Ajana soru"><button class="chip" type="submit" id="askBtn">Sor</button></form>
    </div>
    <div class="inspect" id="inspect">Bir ajana ya da odaya dokun: ne yaptığını görürsün.</div>
  </section>

  <section>
    <h2>Projeler</h2>
    <div class="projects" id="projects"><div class="empty">Projeler yükleniyor…</div></div>
  </section>

  <section>
    <h2>İş tahtası</h2>
    <div class="filters" id="filters" role="group" aria-label="Projeye göre süz"></div>
    <div style="height:14px"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div style="height:10px"></div>
    <div class="board" id="board"></div>
  </section>
</div>

<script>
const DEPTS = [
  { id: "yapim",  name: "Yapımcı",          short: "Yapımcı", role: "İsteği böler, dağıtır" },
  { id: "seviye", name: "Seviye Tasarımı",  short: "Seviye",  role: "Harita, çözücü, zorluk" },
  { id: "sanat",  name: "3D Sanat",         short: "Sanat",   role: "Blender, Meshy, animasyon" },
  { id: "unity",  name: "Unity Geliştirme", short: "Unity",   role: "Oynanış, kamera, arayüz" },
  { id: "qa",     name: "QA / Test",        short: "QA",      role: "Test, hata kaydı" },
  { id: "yayin",  name: "Yayın",            short: "Yayın",   role: "APK, sürüm, mağaza" },
];
const COLS = [{ id: "doing", name: "Sürüyor" }, { id: "todo", name: "Yapılacak" }, { id: "blocked", name: "Bekliyor" }, { id: "done", name: "Bitti" }];
let tasks = [], projects = [], live = null, proj = "all", tab = "doing";
const $ = id => document.getElementById(id);
const deptOf = id => DEPTS.find(d => d.id === id) || DEPTS[0];
const nowS = () => performance.now() / 1000;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- ofis: yerleşim ---------------- */
const W = 960, H = 640, CY = 216, HX = 30, LY = 548;   // CY: odalar arası koridor, HX: sol koridor, LY: salon yürüyüş hattı
const cv = $("office"), cx = cv.getContext("2d");
const rooms = {};
DEPTS.forEach((d, i) => {
  const col = i % 3, row = Math.floor(i / 3);
  const x = 64 + col * 297, y = row === 0 ? 16 : 236, w = 286, h = 180;
  rooms[d.id] = { x, y, w, h, cx: x + w / 2, desk: { x: x + w / 2, y: row === 0 ? y + 96 : y + 116 }, row };
});
const lounge = { x: 64, y: 456, w: 536, h: 172 };
const family = { x: 612, y: 456, w: 332, h: 172 };
const spots = {
  sofa:   [{ x: 132, y: 600 }, { x: 172, y: 600 }, { x: 212, y: 600 }],
  paper:  [{ x: 318, y: 598 }, { x: 372, y: 598 }],
  coffee: [{ x: 462, y: 540 }],
  water:  [{ x: 528, y: 540 }],
  chat:   [[{ x: 168, y: 528 }, { x: 204, y: 528 }], [{ x: 300, y: 530 }, { x: 336, y: 530 }], [{ x: 410, y: 600 }, { x: 446, y: 600 }]],
  couple: [[{ x: 680, y: 598 }, { x: 716, y: 598 }], [{ x: 820, y: 598 }, { x: 856, y: 598 }]],
};
let T = {};
function readTokens() {
  const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
  T = {};
  for (const k of ["floor", "plank", "wall", "wall-in", "hall", "hall-tile", "desk", "desk-top", "screen", "glow", "sofa", "sofa-dark", "rug", "rug2",
    "plant", "pot", "claude", "claude-dark", "cheek", "bubble", "bubble-ink", "spouse-a", "spouse-b", "heart", "paper", "paper-ink", "ink", "muted",
    "me", "me-dark", "crown"])
    T[k.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = g("--" + k);
  T.dept = Object.fromEntries(DEPTS.map(d => [d.id, g("--d-" + d.id)]));
}
readTokens();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens); } catch (e) {}
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const areaOf = p => {
  for (const d of DEPTS) { const r = rooms[d.id]; if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return d.id; }
  if (p.y >= lounge.y && p.x >= family.x) return "family";
  if (p.y >= lounge.y && p.x >= lounge.x) return "lounge";
  return "hall";
};
function exitPath(a) {
  if (rooms[a]) return [{ x: rooms[a].cx, y: CY }];
  if (a === "lounge") return [{ x: 100, y: LY }, { x: HX, y: LY }, { x: HX, y: CY }];
  if (a === "family") return [{ x: 640, y: LY }, { x: 584, y: LY }, { x: 100, y: LY }, { x: HX, y: LY }, { x: HX, y: CY }];
  return [{ x: HX, y: CY }];
}
function route(from, to) {
  const a = areaOf(from), b = areaOf(to);
  if (a === b && a !== "hall") return [to];
  if (a === "lounge" && b === "family") return [{ x: 584, y: LY }, { x: 640, y: LY }, to];
  if (a === "family" && b === "lounge") return [{ x: 640, y: LY }, { x: 584, y: LY }, to];
  const pts = a === "hall" ? [{ x: HX, y: Math.min(Math.max(from.y, CY), LY) }] : exitPath(a);
  pts.push(...exitPath(b).reverse(), to);
  return pts;
}

/* ---------------- karakterler ---------------- */
const SPOUSE_NAMES = ["Ayşe", "Zeynep", "Elif", "Mert", "Deniz", "Ece", "Can", "Selin"];
const agents = DEPTS.map((d, i) => ({
  id: d.id, kind: "agent", x: 120 + i * 70, y: LY, path: [], mode: "rest", until: 0, say: "", sayUntil: 0, sayHeart: false,
  phase: Math.random() * 6, face: 1, spot: null, cheer: 0, nextBreak: rnd(40, 80), sit: false, partner: null, prop: null,
}));
const spouses = [];
let nextVisit = nowS() + rnd(25, 45);
// sen (oyuncu) ve eşin: adlar bu tarayıcıda hatırlanır
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const me = { kind: "player", name: store.get("ofis.me", "Patron"), x: HX, y: LY + 40, path: [], mode: "idle", after: "idle", say: "", sayUntil: 0, sayHeart: false,
  phase: 0, face: 1, spot: null, sit: false, cheer: 0, pendingTalk: null };
let mySpouse = null;
const feed = [];
function log(text) { feed.unshift(text); feed.length = Math.min(feed.length, 4); const f = $("feed"); f.replaceChildren(...feed.map(t => { const s = document.createElement("span"); s.textContent = t; return s; })); }

function goTo(a, p, mode) { a.path = route({ x: a.x, y: a.y }, p); a.mode = "walk"; a.after = mode; a.sit = false; a.prop = null; }
function say(a, text, sec, heart) { a.say = text; a.sayUntil = nowS() + sec; a.sayHeart = !!heart; }
const deptTasks = (id, s) => tasks.filter(t => t.dept === id && (t.status || "todo") === s);
const used = () => new Set([...agents, ...spouses].filter(o => o.spot).map(o => o.spot));
const freeSpot = list => { const u = used(); const f = list.filter(s => !u.has(s)); return f.length ? pick(f) : null; };
const headline = () => {
  const done = tasks.filter(t => t.status === "done").sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  return done.length ? done[Math.floor(Math.random() * Math.min(5, done.length))].title : "Stüdyo büyüyor";
};

const CHAT = [
  ["Rampa bugün çalıştı mı?", "Çözücü geçti, telefonda bakalım."],
  ["Tepegöz yine kaçtı.", "Kalp sayısını mı düşürsek?"],
  ["Kahve bitmiş!", "Yapımcıya söyleyelim, karta yazsın."],
  ["Harita başı kaç üçgen?", "3.6 milyon… inceltmemiz lazım."],
  ["Şahmeran'ın animasyonu nasıl?", "Kolları artık aşağıda, güzel."],
  ["APK kaç MB oldu?", "255. Dokuları küçülteceğiz."],
  ["Hafta sonu ne yapıyorsun?", "Diyarbakır'a, sur turu!"],
  ["Testler yeşil mi?", "34'ün 34'ü geçti."],
  ["Coinler rotayı göstermiyor.", "Kart açıldı, sırada."],
  ["Gazeteyi gördün mü?", "Manşette bizim iş var!"],
];
const COUPLE = [
  ["Eve ne zaman geliyorsun?", "Bu kart bitince, söz."],
  ["Akşam kebap mı?", "Kebap tabii, ciğer de olur."],
  ["Seni özledim.", "Ben de, iyi ki geldin."],
  ["Bugün ne yaptın?", "Bir harita bitirdim, test geçti!"],
  ["Yorgun görünüyorsun.", "Tepegöz yordu biraz."],
  ["Çay getirdim.", "Tam zamanında!"],
];

function seat(a, spotObj, mode, sit) { a.spot = spotObj; goTo(a, { x: spotObj.x, y: spotObj.y }, mode); a.willSit = sit; }

function startChat(a) {
  const others = agents.filter(o => o !== a && !o.partner && (o.mode === "rest" || o.mode === "wander" || o.mode === "paper") && !hasWork(o));
  if (!others.length) return false;
  const b = pick(others), pair = spots.chat.find(p => !used().has(p[0]) && !used().has(p[1]));
  if (!pair) return false;
  a.partner = b; b.partner = a;
  const lines = pick(CHAT);
  a.chat = { lines, turn: 0, next: 0, starter: true }; b.chat = { lines, turn: 0, next: 0, starter: false };
  seat(a, pair[0], "chat", false); seat(b, pair[1], "chat", false);
  return true;
}
function hasWork(a) {
