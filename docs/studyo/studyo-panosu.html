<style>

:root {
  --bg: #efebe4; --panel: #f8f6f1; --ink: #23211f; --muted: #6d6760; --line: #d9d2c7;

  --d-yapim: #b23a2b; --d-seviye: #2f7d55; --d-sanat: #8a4fa3; --d-unity: #3a6ea5; --d-qa: #b7791f; --d-yayin: #4b5563;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a19; --panel: #252321; --ink: #ece7df; --muted: #a39b91; --line: #3a3633; --accent: #e0604d; --copper: #d08a50;
  --floor: #2c2926; --wall: #0f0e0d; --hall: #23201e; --desk: #6b5038; --screen: #101820; --glow: #6fc3ff;
  --claude: #e08463; --claude-dark: #b8603f; --bubble: #f3efe8; --bubble-ink: #1b1a19;
  --d-yapim: #e0604d; --d-seviye: #5bb487; --d-sanat: #b585cc; --d-unity: #6b9ed6; --d-qa: #e0a84a; --d-yayin: #9aa3af;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1a19; --panel: #252321; --ink: #ece7df; --muted: #a39b91; --line: #3a3633; --accent: #e0604d; --copper: #d08a50;
  --floor: #2c2926; --wall: #0f0e0d; --hall: #23201e; --desk: #6b5038; --screen: #101820; --glow: #6fc3ff;
  --claude: #e08463; --claude-dark: #b8603f; --bubble: #f3efe8; --bubble-ink: #1b1a19;
  --d-yapim: #e0604d; --d-seviye: #5bb487; --d-sanat: #b585cc; --d-unity: #6b9ed6; --d-qa: #e0a84a; --d-yayin: #9aa3af;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 50px); line-height: .95; margin: 4px 0 0; text-wrap: balance; }
.counts { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.count b { display: block; font-family: var(--f-display); font-size: 28px; line-height: 1; }
.count span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
h2 { font-family: var(--f-display); font-size: 21px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 10px; }
.office { position: relative; border: 3px solid var(--wall); background: var(--hall); }
.office canvas { display: block; width: 100%; height: auto; cursor: pointer; }
.live { display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); padding: 8px 12px; font-family: var(--f-mono); font-size: 12.5px; min-width: 0; }
.live .dot { width: 9px; height: 9px; border-radius: 50%; background: #3fd17a; flex: none; }
.live .dot.off { background: var(--muted); }
.live span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.inspect { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); padding: 10px 12px; font-size: 14px; min-height: 44px; }
.inspect b { font-family: var(--f-display); font-size: 18px; }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: none; gap: 6px; }
.tab { flex: 1; font: 600 13px var(--f-body); padding: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.col-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.col-h h3 { margin: 0; font-family: var(--f-display); font-size: 18px; text-transform: uppercase; letter-spacing: .05em; }
.col-h span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.card h4 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 2px 7px; overflow-wrap: anywhere; }

.proj .n { font-family: var(--f-display); font-size: 21px; font-weight: 700; }

.s-aktif { color: var(--d-seviye); } .s-bekliyor { color: var(--d-qa); } .s-arsiv { color: var(--muted); }

  .tabs { display: flex; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .col[data-hide="1"] { display: none; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Claude ajan stüdyosu · canlı ofis</div>
      <h1 id="studioName">Oyun Stüdyosu</h1>
    </div>
    <div class="counts">
      <div class="count"><b id="cDoing">0</b><span>Sürüyor</span></div>
      <div class="count"><b id="cTodo">0</b><span>Yapılacak</span></div>
      <div class="count"><b id="cDone">0</b><span>Bitti</span></div>
    </div>
  </header>

  <section style="display:grid;gap:8px">
    <div class="live"><span class="dot off" id="liveDot"></span><span id="liveText">Ofis açılıyor…</span></div>
    <div class="office"><canvas id="office" width="960" height="600" aria-label="Ajanların çalıştığı ofis"></canvas></div>
    <div class="inspect" id="inspect">Bir ajana dokun: ne üzerinde çalıştığını görürsün.</div>
  </section>

  <section>
    <h2>Projeler</h2>
    <div class="projects" id="projects"><div class="empty">Projeler yükleniyor…</div></div>
  </section>

  <section>
    <h2>İş tahtası</h2>
    <div class="filters" id="filters" role="group" aria-label="Projeye göre süz"></div>
    <div style="height:14px"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div style="height:10px"></div>
    <div class="board" id="board"></div>
  </section>
</div>

<script>
const DEPTS = [
  { id: "yapim",  name: "Yapımcı",          short: "Yapımcı", role: "İsteği böler, dağıtır" },
  { id: "seviye", name: "Seviye Tasarımı",  short: "Seviye",  role: "Harita, çözücü, zorluk" },
  { id: "sanat",  name: "3D Sanat",         short: "Sanat",   role: "Blender, Meshy, animasyon" },
  { id: "unity",  name: "Unity Geliştirme", short: "Unity",   role: "Oynanış, kamera, arayüz" },
  { id: "qa",     name: "QA / Test",        short: "QA",      role: "Test, hata kaydı" },
  { id: "yayin",  name: "Yayın",            short: "Yayın",   role: "APK, sürüm, mağaza" },
];
const COLS = [{ id: "doing", name: "Sürüyor" }, { id: "todo", name: "Yapılacak" }, { id: "blocked", name: "Bekliyor" }, { id: "done", name: "Bitti" }];
let tasks = [], projects = [], live = null, proj = "all", tab = "doing";
const $ = id => document.getElementById(id);
const deptOf = id => DEPTS.find(d => d.id === id) || DEPTS[0];

/* ---------------- ofis ---------------- */
const W = 960, H = 600, CY = 216, HX = 30;
const cv = $("office"), cx = cv.getContext("2d");
const rooms = {};
DEPTS.forEach((d, i) => {
  const col = i % 3, row = Math.floor(i / 3);
  const x = 64 + col * 297, y = row === 0 ? 16 : 236, w = 286, h = 180;
  rooms[d.id] = { x, y, w, h, cx: x + w / 2, desk: { x: x + w / 2, y: row === 0 ? y + 92 : y + 112 }, row };
});
const lounge = { x: 64, y: 456, w: 880, h: 132 };
const restSpots = [
  { x: 150, y: 540, kind: "sofa" }, { x: 200, y: 540, kind: "sofa" }, { x: 250, y: 540, kind: "sofa" },
  { x: 430, y: 520, kind: "coffee" }, { x: 600, y: 540, kind: "pingpong" }, { x: 700, y: 540, kind: "pingpong" },
  { x: 840, y: 525, kind: "plant" },
];
let T = {};
function readTokens() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  T = { floor: g("--floor"), wall: g("--wall"), hall: g("--hall"), desk: g("--desk"), screen: g("--screen"), glow: g("--glow"),
        claude: g("--claude"), claudeDark: g("--claude-dark"), bubble: g("--bubble"), bubbleInk: g("--bubble-ink"), ink: g("--ink"), muted: g("--muted"),
        dept: Object.fromEntries(DEPTS.map(d => [d.id, g("--d-" + d.id)])) };
}
readTokens();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens); } catch (e) {}
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const area = p => {
  for (const d of DEPTS) { const r = rooms[d.id]; if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return d.id; }
  if (p.y >= lounge.y) return "lounge";
  return "hall";
};
function route(from, to) {
  const a = area(from), b = area(to), pts = [];
  if (a === b && a !== "hall") return [to];
  if (rooms[a]) pts.push({ x: rooms[a].cx, y: CY });
  if (a === "lounge") pts.push({ x: 110, y: 520 }, { x: HX, y: 520 }, { x: HX, y: CY });
  if (rooms[b]) pts.push({ x: rooms[b].cx, y: CY });
  if (b === "lounge") pts.push({ x: HX, y: CY }, { x: HX, y: 520 }, { x: 110, y: 520 });
  pts.push(to);
  return pts;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const agents = DEPTS.map((d, i) => ({
  id: d.id, x: 120 + i * 120, y: 540, path: [], mode: "rest", until: 0, say: "", sayUntil: 0, phase: Math.random() * 6, face: 1, spot: null, cheer: 0, nextBreak: rnd(40, 80),
}));
function goTo(a, p, mode) { a.path = route({ x: a.x, y: a.y }, p); a.mode = "walk"; a.after = mode; }
function say(a, text, sec) { a.say = text; a.sayUntil = performance.now() / 1000 + sec; }
function deptTasks(id, s) { return tasks.filter(t => t.dept === id && (t.status || "todo") === s); }
function freeRest(a) {
  const used = new Set(agents.filter(o => o !== a && o.spot).map(o => o.spot));
  const free = restSpots.filter(s => !used.has(s));
  return free.length ? free[Math.floor(Math.random() * free.length)] : restSpots[0];
}
function think(a, now) {
  if (a.mode === "walk") return;
  const r = rooms[a.id];
  const doing = deptTasks(a.id, "doing"), blocked = deptTasks(a.id, "blocked");
  const liveHere = live && live.dept === a.id && now - (live.t || 0) < 600;
  const wantWork = doing.length > 0 || liveHere;
  if (a.cheer > now) return;
  if (wantWork) {
    if (a.mode === "break" && now < a.until) return;
    if (now > a.nextBreak && a.mode === "work") {   // kısa kahve molası
      a.nextBreak = now + rnd(50, 90); a.spot = restSpots[3];
      goTo(a, { x: restSpots[3].x + rnd(-14, 14), y: restSpots[3].y }, "break"); a.until = now + rnd(6, 10);
      say(a, "kahve ☕", 3); return;
    }
    if (a.mode !== "work") { a.spot = null; goTo(a, { x: r.desk.x, y: r.desk.y + 26 }, "work"); }
    return;
  }
  if (blocked.length) {
    if (a.mode !== "wait") { a.spot = null; goTo(a, { x: r.desk.x, y: r.desk.y + 26 }, "wait"); }
    return;
  }
  if (a.mode === "rest" && now < a.until) return;
  if (a.mode === "wander" && now < a.until) return;
  if (Math.random() < 0.7) { a.spot = freeRest(a); goTo(a, { x: a.spot.x, y: a.spot.y }, "rest"); a.until = now + rnd(10, 22); }
  else { a.spot = null; goTo(a, { x: r.x + rnd(40, r.w - 40), y: r.y + rnd(60, r.h - 30) }, "wander"); a.until = now + rnd(5, 10); }
}
function step(a, dt, now) {
  if (a.mode !== "walk") return;
  const p = a.path[0]; if (!p) { a.mode = a.after || "rest"; arrive(a, now); return; }
  const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy), v = 95 * dt;
  if (Math.abs(dx) > 0.5) a.face = Math.sign(dx);
  if (d <= v) { a.x = p.x; a.y = p.y; a.path.shift(); } else { a.x += dx / d * v; a.y += dy / d * v; }
}
function arrive(a, now) {
  if (a.mode === "work") {
    const t = deptTasks(a.id, "doing")[0];
    const text = live && live.dept === a.id && now - (live.t || 0) < 600 ? live.text : t ? t.title : "çalışıyor";
    say(a, text, 6);
  } else if (a.mode === "wait") say(a, "karar bekliyorum ?", 6);
  else if (a.mode === "rest") say(a, a.spot?.kind === "coffee" ? "☕" : a.spot?.kind === "pingpong" ? "pinpon!" : "zZ", 3);
  else if (a.mode === "break") a.mode = "break";
}
function wrapText(text, max) {
  const words = String(text).split(/\s+/); const lines = []; let cur = "";
  for (const w of words) { if ((cur + " " + w).trim().length > max) { if (cur) lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) lines.push(cur);
  return lines.slice(0, 2).map((l, i, arr) => i === 1 && lines.length > 2 ? l.slice(0, max - 1) + "…" : l);
}
function drawRoom(d) {
  const r = rooms[d.id], c = T.dept[d.id];
  cx.fillStyle = T.floor; cx.fillRect(r.x, r.y, r.w, r.h);
  cx.globalAlpha = .13; cx.fillStyle = c; cx.fillRect(r.x, r.y, r.w, r.h); cx.globalAlpha = 1;
  cx.strokeStyle = T.wall; cx.lineWidth = 6; cx.strokeRect(r.x, r.y, r.w, r.h);
  // kapı
  cx.fillStyle = T.hall; const dy = r.row === 0 ? r.y + r.h - 4 : r.y - 2; cx.fillRect(r.cx - 22, dy, 44, 6);
  // levha
  cx.fillStyle = c; cx.fillRect(r.x + 10, r.y + 10, 8, 22);
  cx.fillStyle = T.ink; cx.font = "700 20px 'Barlow Condensed', sans-serif"; cx.textBaseline = "top"; cx.fillText(d.name.toUpperCase(), r.x + 24, r.y + 10);
  // masa + ekran
  const k = r.desk;
  cx.fillStyle = T.desk; cx.fillRect(k.x - 46, k.y - 4, 92, 22);
  cx.fillStyle = T.screen; cx.fillRect(k.x - 20, k.y - 28, 40, 24);
  const busy = deptTasks(d.id, "doing").length > 0;
  cx.fillStyle = busy ? T.glow : T.muted; cx.globalAlpha = busy ? (.6 + .4 * Math.sin(performance.now() / 180)) : .4;
  cx.fillRect(k.x - 16, k.y - 24, 32, 16); cx.globalAlpha = 1;
  // oda süsü
  cx.fillStyle = c; cx.globalAlpha = .55;
  if (d.id === "sanat") { cx.fillRect(r.x + r.w - 52, r.y + 40, 30, 38); }
  if (d.id === "seviye") { for (let i = 0; i < 4; i++) cx.fillRect(r.x + r.w - 70 + i * 14, r.y + 50 + (i % 2) * 10, 10, 10); }
  if (d.id === "qa") { cx.beginPath(); cx.arc(r.x + r.w - 40, r.y + 60, 14, 0, 7); cx.fill(); }
  if (d.id === "yayin") { cx.fillRect(r.x + r.w - 60, r.y + 40, 12, 40); cx.fillRect(r.x + r.w - 44, r.y + 52, 12, 28); cx.fillRect(r.x + r.w - 28, r.y + 64, 12, 16); }
  if (d.id === "unity") { cx.fillRect(r.x + r.w - 60, r.y + 44, 40, 26); }
  if (d.id === "yapim") { cx.fillRect(r.x + r.w - 70, r.y + 40, 50, 6); cx.fillRect(r.x + r.w - 70, r.y + 52, 36, 6); cx.fillRect(r.x + r.w - 70, r.y + 64, 44, 6); }
  cx.globalAlpha = 1;
}
function drawLounge() {
  cx.fillStyle = T.floor; cx.fillRect(lounge.x, lounge.y, lounge.w, lounge.h);
  cx.strokeStyle = T.wall; cx.lineWidth = 6; cx.strokeRect(lounge.x, lounge.y, lounge.w, lounge.h);
  cx.fillStyle = T.hall; cx.fillRect(lounge.x - 4, 500, 8, 40);
  cx.fillStyle = T.ink; cx.font = "700 20px 'Barlow Condensed', sans-serif"; cx.textBaseline = "top"; cx.fillText("DİNLENME SALONU", lounge.x + 14, lounge.y + 10);
  cx.fillStyle = T.claudeDark; cx.globalAlpha = .7; cx.fillRect(120, 552, 160, 26); cx.fillRect(120, 532, 160, 10); cx.globalAlpha = 1;   // kanepe
  cx.fillStyle = T.screen; cx.fillRect(412, 478, 36, 34); cx.fillStyle = T.glow; cx.fillRect(420, 486, 8, 6);                        // kahve makinesi
  cx.fillStyle = "#2f7d55"; cx.globalAlpha = .8; cx.fillRect(600, 552, 100, 20); cx.globalAlpha = 1; cx.fillStyle = T.bubble; cx.fillRect(648, 548, 4, 28); // pinpon
  cx.fillStyle = "#2f7d55"; cx.beginPath(); cx.arc(860, 500, 18, 0, 7); cx.fill(); cx.fillStyle = T.desk; cx.fillRect(850, 512, 20, 18);  // bitki
}
function drawAgent(a, now) {
  const walking = a.mode === "walk";
  const working = a.mode === "work" && !a.path.length;
  const bob = walking ? Math.abs(Math.sin(now * 10 + a.phase)) * 3 : working ? Math.sin(now * 14 + a.phase) * 1 : Math.sin(now * 2 + a.phase) * 1.2;
  const jump = a.cheer > now ? Math.abs(Math.sin(now * 9)) * 14 : 0;
  const x = a.x, y = a.y - bob - jump;
  // gölge
  cx.fillStyle = T.wall; cx.globalAlpha = .18; cx.beginPath(); cx.ellipse(a.x, a.y + 2, 13, 4, 0, 0, 7); cx.fill(); cx.globalAlpha = 1;
  // bacaklar
  cx.strokeStyle = T.claudeDark; cx.lineWidth = 4; cx.lineCap = "round";
  const sw = walking ? Math.sin(now * 12 + a.phase) * 5 : 0;
  cx.beginPath(); cx.moveTo(x - 5, y - 6); cx.lineTo(x - 5 + sw, y); cx.moveTo(x + 5, y - 6); cx.lineTo(x + 5 - sw, y); cx.stroke();
  // gövde (yuvarlak kare)
  cx.fillStyle = T.claude; const bw = 26, bh = 24, bx = x - bw / 2, by = y - 6 - bh;
  cx.beginPath(); cx.roundRect ? cx.roundRect(bx, by, bw, bh, 9) : cx.rect(bx, by, bw, bh); cx.fill();
  // atkı (departman rengi)
  cx.fillStyle = T.dept[a.id]; cx.fillRect(bx, by + bh - 7, bw, 5);
  // gözler
  cx.fillStyle = T.wall; const ex = a.face * 2;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "style") e.style.cssText = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const k of kids) if (k) e.append(k);

}

}
